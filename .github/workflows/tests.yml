name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate Windows application icon
        run: python scripts/generate_app_icon.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Compile application modules
        run: python -m compileall -q app core database services ui tests
      - name: Build RW Player Windows package
        run: python -m PyInstaller --clean --noconfirm packaging\\rw_player.spec
      - name: Verify RW Player executable
        run: |
          $executable = Get-ChildItem -Path "dist" -Filter "RW Player.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $executable) {
            Write-Host "PyInstaller output tree:"
            if (Test-Path "dist") {
              Get-ChildItem -Path "dist" -Recurse | Format-Table FullName, Length
            }
            throw "RW Player executable was not found under dist."
          }
          Write-Host "Verified RW Player executable: $($executable.FullName)"
