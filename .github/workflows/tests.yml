name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate Windows application icon
        run: python scripts/generate_app_icon.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build RW Player Windows package
        run: python -m PyInstaller --clean --noconfirm packaging\\rw_player.spec
      - name: Verify RW Player executable
        run: |
          if (-not (Test-Path "dist\\RW Player\\RW Player.exe")) {
            throw "RW Player executable was not created."
          }
