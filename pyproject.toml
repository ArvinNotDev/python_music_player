[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora-music-player"
version = "1.0.0"
description = "A local desktop music player built with PySide6."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "mutagen>=1.47",
    "Pillow>=9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "database*", "services*", "ui*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
